name: Refresh Citations

# Keeps citation counts, impact-factor-adjacent stats and per-person h-index
# up to date: pulls fresh reference/citation data for every publication from
# Crossref (fallback: OpenAlex) via _build/fetch_pub_meta.py, re-attributes
# publications to group members and recomputes each person's citations/
# h-index via _build/match_people.py, rebuilds the static pages, and commits
# the result if anything changed.
#
# Runs monthly and can also be triggered manually from the Actions tab
# (workflow_dispatch) to force a refresh without waiting.
#
# Also refreshes the colab.ws layer (_build/fetch_colab.py) when a
# COLAB_API_KEY repo secret is configured (Settings -> Secrets and variables
# -> Actions). That step is best-effort (continue-on-error) so the workflow
# still runs the core Crossref/OpenAlex refresh even if the secret is absent
# or colab.ws is unreachable.

on:
  schedule:
    - cron: "23 3 1 * *"  # 03:23 UTC on the 1st of every month (odd minute to avoid GitHub's busy top-of-hour load)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: citations-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh citation counts (Crossref / OpenAlex)
        run: python3 _build/fetch_pub_meta.py

      - name: Refresh the colab.ws layer (best-effort, needs COLAB_API_KEY secret)
        env:
          COLAB_API_KEY: ${{ secrets.COLAB_API_KEY }}
        run: python3 _build/fetch_colab.py
        continue-on-error: true

      - name: Recompute per-person publication stats (citations, h-index)
        run: python3 _build/match_people.py

      - name: Rebuild the static site
        run: python3 _build/build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "citations-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes -- nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "Auto-refresh publication citations and author stats" \
            -m "Automated update from the scheduled Refresh Citations workflow: citation counts refreshed from Crossref/OpenAlex, per-person citations and h-index recomputed, static pages rebuilt." \
            -m "Generated by the citations-refresh GitHub Action"
          git push
