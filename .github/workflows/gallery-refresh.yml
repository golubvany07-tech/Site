name: Refresh Gallery

# Keeps the homepage/blog "Gallery" section feeling alive: pulls in any new
# photos from the lab's Telegram channel and from event-type news posts on
# the site (see _build/update_gallery.py for the exact rules), rebuilds the
# static pages, and commits the result if anything changed.
#
# Runs on a schedule and can also be triggered manually from the Actions tab
# (workflow_dispatch) to test or force a refresh without waiting.

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours (odd minute to avoid GitHub's busy top-of-hour load)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gallery-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install Pillow

      - name: Refresh the Gallery photo pool
        run: python3 _build/update_gallery.py

      - name: Rebuild the static site
        run: python3 _build/build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "gallery-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes -- nothing to commit."
            exit 0
          fi
          git add -A
          git commit -m "Auto-refresh Gallery photos" \
            -m "Automated update from the scheduled Refresh Gallery workflow: new Telegram/event photos pulled in, static pages rebuilt." \
            -m "Generated by the gallery-refresh GitHub Action"
          git push
